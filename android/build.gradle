buildscript {
    ext.safeExtGet = {prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.umeng.rn'
    compileSdkVersion safeExtGet('compileSdkVersion', 34)

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 23)
        targetSdkVersion safeExtGet('targetSdkVersion', 34)
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main {
            manifest.srcFile 'src/main/AndroidManifest.xml'
            java.srcDirs = ['src/main/java']
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    // 友盟 SDK 依赖
    implementation 'com.umeng.umsdk:common:+'
    implementation 'com.umeng.umsdk:asms:+'
    // 友盟 Push SDK
    implementation 'com.umeng.umsdk:push:+'
    // 友盟 APM SDK（完整 APM 能力：崩溃/卡顿/启动/页面/网络/自定义日志；
    // UMCrash 完整 API 与 customlog/efs.launch/pagesdk 均在 apm 包，crash 包仅含精简 UMCrash）
    implementation 'com.umeng.umsdk:apm:+'
    // 友盟 Share SDK
    implementation 'com.umeng.umsdk:share-core:+'
}
